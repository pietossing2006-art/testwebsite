# Copy to config.yml and fill in credentials-file after creating the tunnel.
#
# One-time setup (PowerShell):
#   cloudflared tunnel login
#   cloudflared tunnel create vxpers
#   cloudflared tunnel route dns vxpers www.vxpers.com
#   cloudflared tunnel route dns vxpers api.vxpers.com
#   cloudflared tunnel route dns vxpers key.vxpers.com
#
# credentials-file is created in %USERPROFILE%\.cloudflared\<tunnel-id>.json

tunnel: vxpers
credentials-file: C:\Users\Administrator\.cloudflared\REPLACE-WITH-TUNNEL-ID.json

ingress:
  - hostname: www.vxpers.com
    service: http://127.0.0.1:4173
  - hostname: api.vxpers.com
    service: http://127.0.0.1:3001
  - hostname: key.vxpers.com
    service: http://127.0.0.1:3001
  - service: http_status:404
